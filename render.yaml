services:
  - type: web
    name: ai-content-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: AI_PROVIDER
        value: mock
      - key: AUTO_PUBLISH
        value: "false"
      - key: TIMEZONE
        value: Africa/Casablanca
